<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeBath AI — Dashboard</title>
  <style>
    body { margin: 0; background: #020617; }
    #root:empty::after {
      content: "loading dashboard…";
      color: #64748b;
      font-family: system-ui, sans-serif;
      display: block;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    window.addEventListener("error", function (e) {
      var d = document.getElementById("errbox");
      if (!d) {
        d = document.createElement("div");
        d.id = "errbox";
        d.style.cssText =
          "position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;" +
          "color:#fecaca;font:12px monospace;padding:10px;z-index:9999;" +
          "white-space:pre-wrap";
        document.body.appendChild(d);
      }
      d.textContent = "JS error: " + e.message +
        " @ " + (e.filename || "?") + ":" + e.lineno;
    });
  </script>
  <script src="./dist/bundle.js?v=4"></script>
</body>
</html>
